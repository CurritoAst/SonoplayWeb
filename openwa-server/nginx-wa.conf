# /etc/nginx/sites-available/wa.sonoplay.es
# Proxy HTTPS para el servicio open-wa (puerto 3000) bajo wa.sonoplay.es
#
# Pasos en el VPS (Ubuntu), una sola vez:
#   sudo apt-get install -y nginx certbot python3-certbot-nginx
#   sudo nano /etc/nginx/sites-available/wa.sonoplay.es   (pega este archivo)
#   sudo ln -s /etc/nginx/sites-available/wa.sonoplay.es /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d wa.sonoplay.es     # emite el HTTPS y reescribe este server
#
# (El registro DNS A de wa.sonoplay.es → IP del VPS debe existir ANTES de certbot.)

server {
    listen 80;
    server_name wa.sonoplay.es;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
